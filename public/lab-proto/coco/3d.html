<script type="module">
import * as THREE from "three";
{
  "use strict";
  const C = window.SurvCore, T = window.SurvCoco, D = T.DATA;
  const ART = (window.SurvArt && window.SurvArt.cocoHD) || null; // 카드 아이콘(HD 와 같은 것)만
  const hash = location.hash;
  const REDUCE = /reduce/.test(hash) || matchMedia("(prefers-reduced-motion: reduce)").matches;
  const OUTFIT = /tee/.test(hash) ? "tee" : "harness";
  const seedArg = +(hash.match(/seed=(\d+)/) || [])[1] || ((Math.random() * 1e9) | 0);
  const $ = (id) => document.getElementById(id);
  const cv = $("cv"), ov = $("ov"), octx = ov.getContext("2d");
  const VW = 180, VH = 300;
  let DPR = 1;
  let g = null, acc = 0, last = 0, sayT = 0;
  window.__surv = { frames: [], get g() { return g; } };

  // ── 3D 무대 ──────────────────────────────────────────────
  // 좌표: 규칙 x → x, 규칙 y → z, 높이 = y(바닥 0). 카메라는 코코를 따라 비스듬히(약 55°) 내려다본다 — 엄지 조작이라 위아래가 읽혀야 한다.
  const M = window.Surv3D.build(THREE);
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: "high-performance" });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 20, 1400);
  // 1판 55°·폭 180 은 코코가 화면 폭 1/9 의 갈색 덩어리로 보였다 → 50°·폭 150(원근이라 위쪽은 더 넓게 보인다)
  const CAM = { tilt: (50 * Math.PI) / 180, dist: 560, ahead: 18, width: 150 }; // ahead: 코코를 화면 가운데보다 위에(엄지가 아래)
  const hemi = new THREE.HemisphereLight(0xfff4e3, 0x47a35a, 1.6);
  const sun = new THREE.DirectionalLight(0xfffbf4, 1.6);
  sun.position.set(-160, 300, -120);
  scene.add(hemi, sun);
  const ground = M.makeGround(0);
  scene.add(ground.root);
  // 월드(0..540) 밖 바닥: 가장자리에서 카메라가 하늘을 비추지 않게 짙은 풀 판을 넓게 깐다
  const outer = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0x2f7d4a }));
  outer.position.set(270, -0.6, 270);
  scene.add(outer);
  // 하늘·빛 색(시간대): 아침 → 한낮 → 노을 → 저녁(HD 아트 디렉션 3절 하늘 줄)
  const SKY = [[0, 0xbfe6ff, 0xfff4e3, 1.6], [0.5, 0x9fd8ff, 0xfffbf4, 1.7], [0.75, 0xff8fa3, 0xffb38a, 1.3], [1, 0x2a2858, 0x8b5cd6, 0.75]];
  const cA = new THREE.Color(), cB = new THREE.Color();
  function setTod(tod) {
    let i = 0;
    while (i < SKY.length - 2 && tod > SKY[i + 1][0]) i++;
    const [t0, s0, l0, k0] = SKY[i], [t1, s1, l1, k1] = SKY[i + 1], f = Math.min(1, Math.max(0, (tod - t0) / (t1 - t0)));
    scene.background = (scene.background || new THREE.Color()).copy(cA.set(s0)).lerp(cB.set(s1), f);
    sun.color.copy(cA.set(l0)).lerp(cB.set(l1), f);
    sun.intensity = k0 + (k1 - k0) * f;
    hemi.intensity = 0.9 + sun.intensity * 0.45;
    ground.setTod(tod);
  }
  // 코코
  const coco = M.makeCoco(OUTFIT);
  scene.add(coco.root);
  // 종류마다 InstancedMesh 하나(정점 색 + 인스턴스 색 — 번쩍임은 인스턴스 색을 1 넘게)
  const instMat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
  function pool(geo, cap) { const m = new THREE.InstancedMesh(geo, instMat, cap); m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); m.count = 0; m.frustumCulled = false; scene.add(m); return m; }
  const EN = {}, PK = {}, PJ = {};
  for (const k of ["brush", "suds", "suds_s", "bell", "vacuum", "dog", "boss_vacuum", "boss_bath"]) { const e = M.enemyGeometry(k); EN[k] = { mesh: pool(e.geometry, k.startsWith("boss") ? 2 : 160), h: e.height }; }
  for (const k of ["kibble", "treat", "chew", "fruit"]) PK[k] = pool(M.pickupGeometry(k).geometry, k === "kibble" ? 260 : 60);
  for (const k of ["ball", "toy", "chew"]) PJ[k] = pool(M.projGeometry(k).geometry, 60);
  // 접지 그림자: 원판 인스턴스 하나(그림자 맵 없이)
  const blob = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: M.blobTexture(), transparent: true, depthWrite: false, opacity: 0.55 }), 200);
  blob.count = 0; blob.frustumCulled = false; blob.renderOrder = 1; scene.add(blob);
  // 바닥 고리(짖음·뱅글 바람·물웅덩이·꼬리 바람·스키 자국): 고리 메시 묶음
  const ringMat = (c, o) => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: o, depthWrite: false, side: THREE.DoubleSide });
  const RINGS = { bark: [0xffd36b, 0.75, 0.82], wave: [0xe9fbff, 0.8, 0.86], zone: [0x7fd4ff, 0.5, 0], warn: [0x7fd4ff, 0.6, 0.9], aura: [0xb99af0, 0.35, 0.93], trail: [0xcdeea0, 0.7, 0] };
  const RP = {};
  for (const k in RINGS) { const [c, o, inner] = RINGS[k]; const m = new THREE.InstancedMesh(new THREE.RingGeometry(inner, 1, 40).rotateX(-Math.PI / 2), ringMat(c, o), 40); m.count = 0; m.frustumCulled = false; m.renderOrder = 2; scene.add(m); RP[k] = m; }
  const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3(), _e = new THREE.Euler(), _c = new THREE.Color();
  function put(mesh, x, y, z, ry, sx, sy, sz, tint) {
    const i = mesh.count++;
    if (i >= mesh.instanceMatrix.count) { mesh.count--; return; }
    _q.setFromEuler(_e.set(0, ry, 0)); _p.set(x, y, z); _s.set(sx, sy, sz);
    mesh.setMatrixAt(i, _m.compose(_p, _q, _s));
    if (tint != null) { mesh.setColorAt(i, _c.setScalar(tint)); }
    else if (mesh.instanceColor) mesh.setColorAt(i, _c.setScalar(1));
  }
  function fit() {
    const cap = +(hash.match(/dprcap=(\d)/) || [])[1] || 2; // 렌더 DPR 상한 기본 2(규격 3절 실측)
    DPR = Math.min(cap, window.devicePixelRatio || 1);
    const w = $("wrap").clientWidth || 360, h = $("wrap").clientHeight || 600;
    renderer.setPixelRatio(DPR); renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    // 시야 폭이 규칙의 180 단위 안팎이 되게 거리를 맞춘다(세로가 길면 더 멀리)
    CAM.dist = CAM.width / (2 * Math.tan((camera.fov * Math.PI) / 360) * camera.aspect);
    ov.width = Math.round(w * Math.min(2, window.devicePixelRatio || 1)); ov.height = Math.round(h * Math.min(2, window.devicePixelRatio || 1));
  }
  fit();
  addEventListener("resize", () => fit());

  // ── 입력(도트판과 같다) ───────────────────────────────────
  const stick = { on: false, ox: 0, oy: 0, x: 0, y: 0 }, keys = new Set();
  const R_STICK = 38, DEAD = 0.12, wrap = $("wrap");
  wrap.addEventListener("pointerdown", (e) => {
    if (!g || g.state !== "play") return;
    wrap.setPointerCapture(e.pointerId);
    const r = wrap.getBoundingClientRect();
    stick.on = true; stick.ox = e.clientX - r.left; stick.oy = e.clientY - r.top; stick.x = stick.y = 0;
    const s = $("stick"); s.style.display = "block"; s.style.left = stick.ox + "px"; s.style.top = stick.oy + "px"; s.firstChild.style.transform = "";
    $("hint").style.display = "none";
  });
  wrap.addEventListener("pointermove", (e) => {
    if (!stick.on) return;
    const r = wrap.getBoundingClientRect();
    let dx = e.clientX - r.left - stick.ox, dy = e.clientY - r.top - stick.oy;
    const d = Math.hypot(dx, dy);
    if (d > R_STICK) { dx *= R_STICK / d; dy *= R_STICK / d; }
    stick.x = dx / R_STICK; stick.y = dy / R_STICK;
    $("stick").firstChild.style.transform = `translate(${dx}px,${dy}px)`;
  });
  const up = () => { stick.on = false; stick.x = stick.y = 0; $("stick").style.display = "none"; };
  wrap.addEventListener("pointerup", up); wrap.addEventListener("pointercancel", up);
  addEventListener("keydown", (e) => { keys.add(e.key.toLowerCase()); if (g && g.state === "levelup" && /^[123]$/.test(e.key)) pickCard(+e.key - 1); });
  addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
  function readInput() {
    let x = 0, y = 0;
    if (keys.has("arrowleft") || keys.has("a")) x -= 1;
    if (keys.has("arrowright") || keys.has("d")) x += 1;
    if (keys.has("arrowup") || keys.has("w")) y -= 1;
    if (keys.has("arrowdown") || keys.has("s")) y += 1;
    if (x || y) { const m = Math.hypot(x, y); return { x: x / m, y: y / m }; }
    const m = Math.hypot(stick.x, stick.y);
    if (m < DEAD) return { x: 0, y: 0 };

  // ── 손맛 계층(JUICE): 그림 규칙과 무관한 화면 몫. shell 에 더할 것 ─────────────
  // 히트 멈춤은 「게임 시간을 멈춘다」 — 규칙의 시간이 잠깐 서는 것이라 공정하다(모두에게 같은 사건에서).
  // 피해 숫자는 큰 한 방만(스키·뱅글·멍멍·보스). 20 이면 앉아서 두 배가 된 꼬리 바람(틱 23 안팎)이 화면을 숫자로 덮었다
  const JUICE_NUM_MIN = 40;
  const JUICE = {
    parts: [], nums: [], shake: 0, stop: 0, hpSeen: new Map(), hitT: new Map(),
    PART_CAP: 140, NUM_CAP: 16,
    burst(kind, x, y, n, speed, size, life) {
      if (REDUCE) return;
      for (let i = 0; i < n && this.parts.length < this.PART_CAP; i++) {
        const a = Math.random() * Math.PI * 2, v = speed * (0.4 + Math.random() * 0.8);
        this.parts.push({ kind, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - speed * 0.3, life, max: life, size: size * (0.6 + Math.random() * 0.6), rot: Math.random() * 6 });
      }
    },
    num(n, x, y) { if (this.nums.length < this.NUM_CAP) this.nums.push({ n: Math.round(n), x, y, life: 0.7 }); },
    kick(s) { if (!REDUCE) this.shake = Math.max(this.shake, s); },
    freeze(sec) { if (!REDUCE) this.stop = Math.max(this.stop, sec); },
    step(dt) {
      for (const p of this.parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy = p.vy * 0.92 + 12 * dt; }

      this.nums = this.nums.filter((q) => q.life > 0);

    },
    // 보이는 적의 체력이 한 프레임에 크게 줄면 숫자(JUICE_NUM_MIN 이상)·찌그러짐
    watch(g, inView) {

      if (this.hpSeen.size > 400) { const live = new Set(g.enemies.map((e) => e.id)); for (const id of this.hpSeen.keys()) if (!live.has(id)) this.hpSeen.delete(id); }
    },
  };

  // ── 게임별 부분(Shell 칸 꼴) ─────────────────────────────
  let poseNow = "sit", poseAt = 0, cocoFace = Math.PI / 2;
  const GAME = {
    game: "coco-hd",
    theme: T,
    cardText(c) {
      const W = D.WEAPONS, P = D.PASSIVES, TC = D.THEME_CARDS;
      if (c.type === "evo") { const w = W[c.key]; return { ico: "evo", name: w.evo.name, lv: "진화", desc: `${w.name} 최고 단계 + ${P[w.evo.with]} → 더 센 꼴로`, cls: "evo" }; }
      if (c.type === "weapon") { const w = W[c.key]; const tip = { ball: "가장 가까운 것에 삑삑이 공", wag: "둘레를 꼬리 바람으로 · 앉으면 두 배", bark: "화면 안 싫은 것 머리 위로 멍!", toy: "인형을 물고 휘둘러요", chew: "걷는 쪽으로 개껌을 굴려요" }[c.key]; return { ico: c.key, name: w.name, lv: c.lv === 1 ? "NEW" : `LV ${c.lv}`, desc: tip + (w.evo ? ` · 진화 짝: ${P[w.evo.with]}` : "") }; }

      if (c.type === "theme") { const t = TC[c.key]; const tip = { sit: "기운이 30 % 더 빨리 차요", scoot: "똥꼬 스키 거리 +20 % · 피해 +25 %", spin: "뱅글뱅글 바람이 더 크고 세요", calm: "앉아 있는 동안 체력이 차요", sneak: c.lv === 1 ? "스키로 지나간 길의 간식을 먹어요" : "스키 중에 잡으면 체력 +1" }[c.key]; return { ico: c.key, name: t.name, lv: `${c.lv}/${t.max}`, desc: tip, tag: "습관", cls: "habit" }; }

    },
    // 3D 그리기 갈고리(Shell 의 draw 자리): 규칙 상태 → 인스턴스 행렬·코코 자세
    draw(g) {
      const t = g.time, p = g.p;
      setTod(T.tod(g));
      for (const k in EN) EN[k].mesh.count = 0;
      for (const k in PK) PK[k].count = 0;
      for (const k in PJ) PJ[k].count = 0;

      for (const e of g.enemies) {
        if (!close(e.x, e.y)) continue;
        const E = EN[e.kind]; if (!E) continue;
        const sc = 1; // 모델이 종류별 실제 크기로 나온다(폭 = 충돌 지름 × 0.86–1.33, 10-28 바운딩 박스 실측) — 시안이 다시 키우면 보스가 4배 넘게 커진다

        put(E.mesh, e.x, 0, e.y, ry, sc * (1 + hit * 0.1), sc * bob * (1 - hit * 0.15), sc * (1 + hit * 0.1), e.flash > 0 ? 1.9 : 1);

      for (const k of g.pickups) if (close(k.x, k.y)) put(PK[k.kind === "heal" ? "chew" : "fruit"], k.x, 2 + Math.sin(t * 3) * 0.8, k.y, t, 1, 1, 1);
      for (const b of g.shots) put(PJ[b.w === "ball" ? "ball" : "chew"], b.x, 5, b.y, t * 8, 1, 1, 1);
      for (const w of g.weapons) {

    },
    hud(g) {

      $("lvNum").textContent = `LV ${g.lv}`;

        sub: won ? "오늘도 좋은 하루였어요. 고기 냠냠." : `${m}분 ${s}초 놀았어요. 한숨 자고 다시 놀아요.`,
        rows: [["놀았던 시간", `${m}:${String(s).padStart(2, "0")}`], ["물리친 것", g.kills], ["똥꼬 스키", g.coco.scoots], ["기운 가득 스키", g.coco.bigScoots], ["점수", C.score(g)]],
      };
    },
    stress(g) {
      while (g.enemies.length < C.CORE.ENEMY_CAP) { const [x, y] = C.ringPoint(g, -40 - g.r() * 60); const e = C.spawnAt(g, ["brush", "suds", "bell", "dog"][(g.r() * 4) | 0], x, y); e.hp = e.maxHp = 1e9; }

  };

  // ── 카드·덮개(도트판 흐름 그대로) ─────────────────────────
  // 레벨업 상자가 뜬 뒤 카드 잠금(ms). 카드는 0–150 ms 동안 튀어 오르며 투명한데도 눌렸다 — 놀던 엄지의 연타가 그대로 카드를 고를 수 있다
  const LOCK_MS = 350;
  function showLevel() {
    $("lvTitle").textContent = `LV ${g.lv}`;
    const box = $("cards"); box.innerHTML = "";
    g.offer.forEach((c, i) => {
      const t = GAME.cardText(c), b = document.createElement("button");
      b.className = "card " + (t.cls || "");
      const src = ART && ART.iconURL ? ART.iconURL(t.ico, Math.round(42 * DPR)) : "";
      b.innerHTML = `<span class="ico" aria-hidden="true">${src ? `<img src="${src}" width="42" height="42" alt="">` : ""}</span><b>${t.name}</b><span class="lv">${t.lv}</span><small>${t.tag ? `${t.tag} · ` : ""}${t.desc}</small>`;
      b.onclick = () => pickCard(i);

    $("lvl").classList.add("on");

  }
  function pickCard(i) {
    if ($("cards").classList.contains("lock")) return; // 키보드 1·2·3 도 같은 잠금
    if (!C.choose(g, i)) return;
    $("lvl").classList.remove("on");
    if (g.state === "levelup") showLevel();
    last = performance.now();
  }
  $("reroll").onclick = () => { if (C.reroll(g)) showLevel(); };
  function say(text) { const s = $("say"); s.firstChild.textContent = text; s.classList.add("on"); sayT = 2.2; }
  const FX = { say, shake: (n) => JUICE.kick(n), sfx: () => {} };
  function endScreen() {
    const r = GAME.end(g);
    $("endTitle").textContent = r.title; $("endSub").textContent = r.sub;
    $("res").innerHTML = r.rows.map(([a, b]) => `<span>${a}</span><span>${b}</span>`).join("");
    $("end").classList.add("on");
  }
  function start() {
    g = C.create(T, seedArg);
    const ft = +(hash.match(/t=(\d+)/) || [])[1];
    if (ft) fastForward(ft);
    if (/stress/.test(hash)) GAME.stress(g);
    $("start").classList.remove("on"); $("end").classList.remove("on");
    acc = 0; last = performance.now(); poseAt = 0;
  }
  function fastForward(t) {
    while (g.time < t && (g.state === "play" || g.state === "levelup")) {
      if (g.state === "levelup") { C.choose(g, 0); continue; }
      let fx = 0, fy = 0;
      C.near(g, g.p.x, g.p.y, 60, (e) => { const dx = g.p.x - e.x, dy = g.p.y - e.y, d2 = dx * dx + dy * dy + 1; fx += dx / d2; fy += dy / d2; });
      let x = fx * 40, y = fy * 40;
      const E = 70;
      if (g.p.x < E) x += 0.6; if (g.p.x > g.world - E) x -= 0.6; if (g.p.y < E) y += 0.6; if (g.p.y > g.world - E) y -= 0.6;
      g.input = { x, y };
      g.p.hp = g.p.maxHp;
      C.step(g); g.events.length = 0;
    }
  }
  $("go").onclick = start; $("again").onclick = start;

  // ── 그리기 틀 ────────────────────────────────────────────
  const _v = new THREE.Vector3();
  function toScreen(x, h, y) { _v.set(x, h, y).project(camera); return [(_v.x * 0.5 + 0.5) * ov.width, (-_v.y * 0.5 + 0.5) * ov.height, _v.z < 1]; }
  function render() {
    const p = g.p;
    let sx = 0, sz = 0;
    if (JUICE.shake) { sx = (Math.random() - 0.5) * JUICE.shake; sz = (Math.random() - 0.5) * JUICE.shake; }
    // 카메라 목표는 월드 안에 묶는다(2D 판의 camera() 와 같은 뜻) — 1판은 가장자리 너머를 비춰 화면 절반이 하늘이었다
    const hw = CAM.width / 2 - 20;
    const tx = C.clamp(p.x, hw, g.world - hw) + sx, tz = C.clamp(p.y - CAM.ahead, 150, g.world - 45) + sz; // 위쪽(먼 쪽)은 원근으로 넓게 보여 더 안쪽에서 묶는다(가장자리 실측 캡처로 맞춘 값)
    camera.position.set(tx, Math.sin(CAM.tilt) * CAM.dist, tz + Math.cos(CAM.tilt) * CAM.dist);
    camera.lookAt(tx, 0, tz);

    GAME.draw(g);
    renderer.render(scene, camera);
    window.__surv.gpu = { calls: renderer.info.render.calls, tris: renderer.info.render.triangles }; // 휴대폰 GPU 부담은 CPU 늦추기로 못 잰다 — 호출·삼각형으로 맞댄다
    // 겹 캔버스(2D): 머리 위 기운 뼈 셋·입자·피해 숫자 — 3D 장면에 섞지 않고 화면 좌표로
    octx.setTransform(1, 0, 0, 1, 0, 0);
    octx.clearRect(0, 0, ov.width, ov.height);
    const u = ov.width / 360;
    if (g.coco.gauge > 0 && !g.coco.dash) {
      const [hx, hy] = toScreen(p.x, 30, p.y), gv = g.coco.gauge / 100;
      for (let i = 0; i < 3; i++) { octx.fillStyle = gv >= (i + 1) / 3 - 0.001 ? (gv >= 1 ? "#ffd36b" : "#f6e3c4") : "rgba(58,34,40,.35)"; octx.beginPath(); octx.roundRect(hx + (i - 1.5) * 11 * u + u, hy - 3 * u, 9 * u, 6 * u, 3 * u); octx.fill(); }

    octx.globalAlpha = 1;
    octx.font = `900 ${Math.round(15 * u)}px "Pretendard Variable", Pretendard, system-ui, sans-serif`; octx.textAlign = "center";
    for (const q of JUICE.nums) { const [x, y] = toScreen(q.x, 14, q.y); octx.globalAlpha = Math.min(1, q.life / 0.3); octx.lineWidth = 4 * u; octx.strokeStyle = "#3a2228"; octx.strokeText(q.n, x, y); octx.fillStyle = "#fffbf4"; octx.fillText(q.n, x, y); }
    octx.globalAlpha = 1;
  }
  function frame(now) {
    requestAnimationFrame(frame);
    if (!g) return;
    const t0 = performance.now();
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (g.state === "play") {
      if (JUICE.stop > 0) JUICE.stop -= dt; // 히트 멈춤: 이 동안 규칙 시간이 선다
      else {
        acc += dt;
        g.input = readInput();
        while (acc >= C.CORE.DT && g.state === "play") { C.step(g); acc -= C.CORE.DT; for (const ev of g.events) GAME.onEvent(ev, g, FX); g.events.length = 0; }
      }
      if (g.state === "levelup") showLevel();
      else if (g.state === "won" || g.state === "lost") endScreen();
    } else if (g.state === "levelup" && !$("lvl").classList.contains("on")) showLevel();
    for (const [id, v] of JUICE.hitT) { if (v - dt <= 0) JUICE.hitT.delete(id); else JUICE.hitT.set(id, v - dt); }
    JUICE.step(dt);
    if (sayT > 0) { sayT -= dt; if (sayT <= 0) $("say").classList.remove("on"); }
    render();
    GAME.hud(g);
    const fr = window.__surv.frames; fr.push(performance.now() - t0); if (fr.length > 600) fr.shift();
  }
  requestAnimationFrame(frame);
  if (/t=|stress|autostart/.test(hash)) start();
}
</script>
