<title>코코의 집으로 — 조작감 시험 판</title>
<!-- 디자인 세션 시안(10-29). 의뢰서 docs/lab-home-brief.md · 규격 docs/lab-home-spec.md · 규칙 엔진 docs/lab-home.js · 코코 모델 docs/lab-surv-coco-3d-models.js
     빈 회색 맵 하나: 달리기·점프·똥꼬 스키·뱅글뱅글, 발판·구멍·낮은 틈·적 둘. Dean 실기기 판정을 받는 첫 판(손맛 수치는 엔진 TUNE).
     놀이 화면만 Three.js(CDN three@0.180.0 — 구현은 npm 으로 묶는다). 주소 끝: #reduce · #debug(몸 상자·여유 알림) · #dprcap=N(기본 2) · #mute
     🔴 코코 참고 사진은 생김새 참고로만. 사진·사람·집 안은 어디에도 없다. -->
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js" } }</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
:root {
  --cream: #fffaf2; --cream2: #f6e3c4; --line: #ecd3a6; --ink: #3a2228; --ink2: #5a3a42; --fur: #b8643a; --fur2: #8e4526;
  --gold: #ffd36b; --gold2: #e0a640; --teal: #2fb5a8; --teal2: #1f8f86; --pink: #f07a8a; --shadow: rgba(58, 34, 40, .22);
  --pad-h: 176px; /* 세로 화면 아래 조작 띠 높이 */
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #2c2f3a; color: var(--ink); font-family: "Pretendard Variable", Pretendard, system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; -webkit-tap-highlight-color: transparent; }
body { overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
/* 세로: 위 = 놀이 화면, 아래 = 조작 띠(엄지가 화면을 가리지 않게). 가로: 놀이 화면이 다 덮고 단추가 아래 양 끝에 뜬다 */
#view { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; background: #bfc4ce; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#pad { position: relative; flex: 0 0 calc(var(--pad-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: linear-gradient(180deg, #3a3e4b, #2c2f3a); }
body.land #pad { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; background: none; pointer-events: none; padding: 0; }
.ctl { position: absolute; pointer-events: auto; touch-action: none; border: 0; padding: 0; font: inherit; color: var(--ink); }
/* 왼쪽 엄지: 좌우 판 하나(누른 자리가 가운데 왼쪽이면 왼쪽). 엄지를 떼지 않고 미끄러뜨려 방향을 바꾼다 */
#mv { left: 14px; bottom: calc(22px + env(safe-area-inset-bottom)); width: 156px; height: 96px; border-radius: 48px; background: rgba(255, 250, 242, .14); box-shadow: inset 0 0 0 2px rgba(255, 250, 242, .35); display: flex; }
#mv > i { flex: 1; display: grid; place-items: center; font-style: normal; font-size: 30px; font-weight: 900; color: rgba(255, 250, 242, .85); border-radius: 48px; transition: background .06s; }
#mv > i.on { background: rgba(255, 211, 107, .55); color: var(--ink); }
/* 오른쪽 엄지: 점프(크게, 오른쪽 아래) · 기술(왼쪽 위 비스듬히) — 엄지를 굴려 둘을 잇는다 */
.rb { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 15px; line-height: 1.1; text-align: center; box-shadow: 0 4px 0 rgba(0, 0, 0, .28), 0 6px 14px rgba(0, 0, 0, .25); }
.rb b { display: block; font-size: 24px; }
#bj { right: 16px; bottom: calc(26px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, #ffd36b, #e0a640); }
#bs { right: 112px; bottom: calc(64px + env(safe-area-inset-bottom)); width: 68px; height: 68px; font-size: 13px; background: linear-gradient(180deg, #7fe0d4, #2fb5a8); }
#bs b { font-size: 20px; }
.rb.on { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, .28); filter: brightness(1.08); }
body.land #mv { background: rgba(58, 62, 75, .28); }
body.land .rb { opacity: .78; }
/* 큰 화면(아이패드): 단추를 키운다 — 엄지 닿는 자리는 같은 모서리 */
@media (min-width: 760px) and (min-height: 760px) { :root { --pad-h: 220px; } #mv { width: 210px; height: 124px; border-radius: 62px; left: 28px; } #mv > i { font-size: 38px; border-radius: 62px; } #bj { width: 112px; height: 112px; right: 30px; bottom: 34px; } #bs { width: 90px; height: 90px; right: 156px; bottom: 86px; } .rb b { font-size: 30px; } }
/* HUD */
#hud { position: absolute; left: 8px; right: 8px; top: calc(8px + env(safe-area-inset-top)); display: flex; gap: 6px; align-items: center; pointer-events: none; z-index: 3; }
.pill { display: flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; background: rgba(255, 250, 242, .88); box-shadow: 0 1px 5px var(--shadow); font-weight: 800; font-size: 13px; min-height: 28px; }
#hearts svg { width: 20px; height: 18px; }
#hearts svg.off path { fill: #d9cfc4; stroke: #b9aa9a; }
#hud .sp { flex: 1; }
#tag { position: absolute; left: 50%; transform: translateX(-50%); top: calc(44px + env(safe-area-inset-top)); font-size: 12px; font-weight: 700; color: #3a3e4b; background: rgba(255, 250, 242, .7); padding: 2px 10px; border-radius: 999px; z-index: 3; pointer-events: none; white-space: nowrap; }
#toast { position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%); font-weight: 900; font-size: 20px; color: var(--ink); background: rgba(255, 250, 242, .92); padding: 8px 16px; border-radius: 14px; box-shadow: 0 3px 12px var(--shadow); z-index: 4; pointer-events: none; opacity: 0; transition: opacity .18s; white-space: nowrap; }
#toast.on { opacity: 1; }
#dbg { position: absolute; left: 8px; bottom: 8px; z-index: 3; font: 11px/1.35 ui-monospace, Consolas, monospace; color: #fff; background: rgba(0, 0, 0, .45); padding: 4px 6px; border-radius: 6px; pointer-events: none; display: none; white-space: pre; }
body.debug #dbg { display: block; }
/* 덮개(시작·결과) */
.ov { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(44, 47, 58, .55); padding: 16px; }
.ov[hidden] { display: none; }
.card { width: min(100%, 360px); background: var(--cream); border-radius: 22px; padding: 20px 18px 18px; box-shadow: 0 10px 30px rgba(0, 0, 0, .3); text-align: center; }
.card h1 { margin: 0 0 4px; font-size: 22px; color: var(--fur2); }
.card h2 { margin: 0 0 6px; font-size: 20px; color: var(--fur2); }
.card p { margin: 6px 0; font-size: 14px; color: var(--ink2); line-height: 1.5; }
.how { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 14px; text-align: left; }
.how div { background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 8px; font-size: 12.5px; line-height: 1.35; color: var(--ink2); }
.how b { display: block; font-size: 14px; color: var(--ink); }
.btn { min-height: 52px; min-width: 140px; padding: 0 26px; border: 0; border-radius: 999px; background: linear-gradient(180deg, #ffd36b, #e0a640); color: var(--ink); font: inherit; font-weight: 900; font-size: 18px; box-shadow: 0 3px 0 #b07a1c, 0 6px 14px var(--shadow); cursor: pointer; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b07a1c; }
.stats { display: flex; justify-content: center; gap: 14px; margin: 10px 0 14px; font-weight: 800; font-size: 15px; }
.fade { position: absolute; inset: 0; background: #2c2f3a; opacity: 0; pointer-events: none; z-index: 5; transition: opacity .16s; }
.fade.on { opacity: .75; }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="pill" id="hearts" aria-label="하트"></div>
      <div class="pill" aria-label="뼈다귀">🦴 <span id="bones">0/3</span></div>
      <div class="sp"></div>
      <div class="pill" aria-label="간식 점수">🍪 <span id="score">0</span></div>
      <div class="pill" aria-label="시간"><span id="time">0.0</span>초</div>
    </div>
    <div id="tag">조작감 시험 판 · 빈 회색 맵</div>
    <div id="toast"></div>
    <div id="dbg"></div>
    <div class="fade" id="fade"></div>
    <div class="ov" id="ov-start">
      <div class="card">
        <h1>코코의 집으로</h1>
        <p>조작감 시험 판 — 그림은 회색 상자뿐이에요.<br />달리고 뛰는 손맛만 봐 주세요.</p>
        <div class="how">
          <div><b>◀ ▶ 달리기</b>왼쪽 엄지를 떼지 않고 미끄러뜨려 방향을 바꿔요</div>
          <div><b>점프</b>길게 누르면 높이, 톡 누르면 낮게</div>
          <div><b>기술 · 땅에서</b>똥꼬 스키 — 낮은 틈을 지나고 적을 밀어내요</div>
          <div><b>기술 · 공중에서</b>뱅글뱅글 — 둥실 떠서 적을 터뜨려요</div>
        </div>
        <button class="btn" id="go">시작</button>
        <p style="font-size:12px">키보드: ← → 달리기 · Space 점프 · X 기술 · ↓+달리기 스키</p>
      </div>
    </div>
    <div class="ov" id="ov-end" hidden>
      <div class="card">
        <h2 id="end-h">도착!</h2>
        <p id="end-p"></p>
        <div class="stats" id="end-s"></div>
        <button class="btn" id="again">다시</button>
      </div>
    </div>
  </div>
  <div id="pad">
    <div class="ctl" id="mv" aria-label="좌우로 달리기"><i id="mvL">◀</i><i id="mvR">▶</i></div>
    <button class="ctl rb" id="bs" aria-label="기술"><span><b>🌀</b>기술</span></button>
    <button class="ctl rb" id="bj" aria-label="점프"><span><b>⤒</b>점프</span></button>
  </div>
</div>
<script src="lab-home.js"></script>
<script src="lab-surv-coco-3d-models.js"></script>
<script type="module">
import * as THREE from "three";
{
  "use strict";
  const E = window.LabHome, TU = E.TUNE;
  const hash = location.hash;
  const REDUCE = /reduce/.test(hash) || matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DEBUG = /debug/.test(hash);
  let MUTE = /mute/.test(hash);
  const $ = (id) => document.getElementById(id);
  if (DEBUG) document.body.classList.add("debug");
  let g = null, running = false;
  window.__home = { frames: [], gaps: [], get g() { return g; }, inp: null, steps: 0 }; // frames = 한 프레임 일 시간 · gaps = rAF 사이 간격(규격의 p95 ≤ 20 ms 는 이것)

  // ── 3D 무대 ── 좌표: x = 칸(오른쪽), y = 칸(위), z = 깊이(카메라 쪽 +). 코코 길 z = 0
  const M = window.Surv3D.build(THREE);
  const cv = $("cv");
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: "high-performance" });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbfc4ce);
  scene.fog = new THREE.Fog(0xbfc4ce, 40, 80);
  const camera = new THREE.PerspectiveCamera(30, 1, 1, 200);
  const hemi = new THREE.HemisphereLight(0xfff4e3, 0x6a6f7c, 1.7);
  const sun = new THREE.DirectionalLight(0xfffbf4, 1.5);
  sun.position.set(-6, 14, 10);
  scene.add(hemi, sun);
  const Lmat = (c) => new THREE.MeshLambertMaterial({ color: c, flatShading: true });
  const MAT = { side: Lmat(0x8a909e), top: Lmat(0xcfd3dc), semi: Lmat(0x7d93b8), semiTop: Lmat(0xa3b4d6), wall: Lmat(0x9aa0ac), back: Lmat(0xa7acba), backDark: Lmat(0x969bab) };

  // 판 짓기(맵이 바뀌면 다시)
  const world = new THREE.Group(); scene.add(world);
  const DEPTH = 3; // 길 깊이(z −1.5..1.5)
  function buildWorld(L) {
    world.clear();
    for (const [x, y, w, h] of L.solids) {
      if (y > 0) {
        // 떠 있는 벽(낮은 틈 천장): 길 뒤쪽 반만 채우고 앞에는 아래 테두리만 — 통째 상자면 스키하는 코코를 가렸다(화면 보고 고침)
        const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, DEPTH / 2 - 0.4), MAT.wall);
        body.position.set(x + w / 2, y + h / 2, -DEPTH / 4 - 0.2); world.add(body);
        const lip = new THREE.Mesh(new THREE.BoxGeometry(w, 0.28, DEPTH), MAT.side);
        lip.position.set(x + w / 2, y + 0.14, 0); world.add(lip);
        continue;
      }
      const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, DEPTH), MAT.side);
      body.position.set(x + w / 2, y + h / 2, 0); world.add(body);
      const top = new THREE.Mesh(new THREE.BoxGeometry(w + 0.04, 0.14, DEPTH + 0.04), MAT.top);
      top.position.set(x + w / 2, y + h - 0.07 + 0.001, 0); world.add(top);
    }
    for (const [x, y, w] of L.semis) {
      const s = new THREE.Mesh(new THREE.BoxGeometry(w, 0.22, DEPTH * 0.8), MAT.semi);
      s.position.set(x + w / 2, y - 0.11, -0.2); world.add(s);
      for (let i = 0; i < 2; i++) { const leg = new THREE.Mesh(new THREE.BoxGeometry(0.14, y, 0.14), MAT.semiTop); leg.position.set(x + 0.2 + i * (w - 0.4), y / 2, -1.2); world.add(leg); }
    }
    // 뒤 벽: 2 칸마다 기둥 — 달리는 빠르기가 눈에 읽히게(빈 맵이라도 흐름이 보여야 손맛을 판다)
    const back = new THREE.Mesh(new THREE.BoxGeometry(L.w + 40, 14, 0.4), MAT.back); back.position.set(L.w / 2, 3, -5); world.add(back);
    const pillar = new THREE.BoxGeometry(0.5, 14, 0.5);
    for (let x = -10; x < L.w + 10; x += 2) { const m = new THREE.Mesh(pillar, x % 10 === 0 ? MAT.side : MAT.backDark); m.position.set(x, 3, -4.6); world.add(m); }
    // 바닥 아래 어둠(구멍 깊이)
    const pit = new THREE.Mesh(new THREE.BoxGeometry(L.w + 40, 2, DEPTH + 6), Lmat(0x3a3e4b)); pit.position.set(L.w / 2, -6.5, -1); world.add(pit);
    // 체크포인트 깃대 · 도착 표지
    cpFlag = flag(L.cp[0], L.cp[1], 0xa7acba); world.add(cpFlag.g);
    goalFlag = flag(L.goal, 0, 0xffd36b, true); world.add(goalFlag.g);
  }
  let cpFlag, goalFlag;
  function flag(x, y, color, big) {
    const g2 = new THREE.Group(); g2.position.set(x, y, -1.1);
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, big ? 3.2 : 2.4, 6), Lmat(0x5a5f7a)); pole.position.y = big ? 1.6 : 1.2; g2.add(pole);
    const cloth = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.55, 0.06), Lmat(color)); cloth.position.set(0.5, big ? 2.85 : 2.1, 0); g2.add(cloth);
    if (big) { const paw = new THREE.Mesh(new THREE.CircleGeometry(0.16, 10), Lmat(0x8e4526)); paw.position.set(0.5, 2.85, 0.04); g2.add(paw); }
    return { g: g2, cloth };
  }

  // 코코: 모델 길이를 1.15 칸에 맞춘다(엔진 몸 상자 0.9 × 0.85 보다 조금 크게 — 털이 상자 밖으로 삐져나와도 맞음 판정은 상자)
  const coco = M.makeCoco("harness");
  const cocoHold = new THREE.Group(); cocoHold.add(coco.root); scene.add(cocoHold);
  {
    const bb = new THREE.Box3().setFromObject(coco.root), sz = bb.getSize(new THREE.Vector3());
    coco.root.scale.setScalar(1.15 / Math.max(sz.x, sz.z));
  }
  const blobMat = new THREE.MeshBasicMaterial({ map: M.blobTexture(), transparent: true, depthWrite: false, opacity: 0.6 });
  const blob = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.7).rotateX(-Math.PI / 2), blobMat); blob.renderOrder = 1; scene.add(blob);

  // 적(시험 판 둘): 칫솔 = 크림 손잡이 + 민트 솔 · 거품 = 반투명 공 + 반짝
  function makeEnemy(kind) {
    const g2 = new THREE.Group();
    if (kind === "brush") {
      const h = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.22, 0.3), Lmat(0xfff4e3)); h.position.y = 0.42; g2.add(h);
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.3, 0.34), Lmat(0xfff4e3)); head.position.set(-0.36, 0.42, 0); g2.add(head);
      const br = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.3, 0.32), Lmat(0x7fe0d4)); br.position.set(-0.36, 0.16, 0); g2.add(br);
      for (const s of [-1, 1]) { const eye = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 4), Lmat(0x24161d)); eye.position.set(0.15 + s * 0.12, 0.5, 0.16); g2.add(eye); }
      for (const s of [-1, 1]) { const leg = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.3, 0.08), Lmat(0x5a3a42)); leg.position.set(0.2 + s * 0.22, 0.15, 0); leg.name = "leg" + s; g2.add(leg); }
    } else {
      const b = new THREE.Mesh(new THREE.IcosahedronGeometry(0.42, 1), new THREE.MeshLambertMaterial({ color: 0xe8f4fb, transparent: true, opacity: 0.82, flatShading: true })); b.position.y = 0.4; g2.add(b);
      const s2 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.2, 0), Lmat(0xffffff)); s2.position.set(0.32, 0.72, 0.1); g2.add(s2);
      const sh = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 4), Lmat(0xffffff)); sh.position.set(-0.14, 0.58, 0.36); g2.add(sh);
      for (const s of [-1, 1]) { const eye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 4), Lmat(0x24161d)); eye.position.set(s * 0.12, 0.42, 0.39); g2.add(eye); }
    }
    scene.add(g2); return g2;
  }
  // 먹을 것: 하트(분홍 입체) · 뼈다귀(크림) · 간식(쿠키)
  function makePick(kind) {
    const g2 = new THREE.Group();
    if (kind === "heart") {
      const sh = new THREE.Shape(); sh.moveTo(0, -0.32); sh.bezierCurveTo(-0.5, 0.02, -0.34, 0.38, 0, 0.18); sh.bezierCurveTo(0.34, 0.38, 0.5, 0.02, 0, -0.32);
      const m = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: 0.16, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.05, bevelSegments: 1, curveSegments: 6 }), Lmat(0xf07a8a)); m.position.z = -0.08; g2.add(m);
    } else if (kind === "bone") {
      const c = Lmat(0xfff4e3), r = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.56, 6).rotateZ(Math.PI / 2), c); g2.add(r);
      for (const sx of [-1, 1]) for (const sy of [-1, 1]) { const k = new THREE.Mesh(new THREE.IcosahedronGeometry(0.12, 0), c); k.position.set(sx * 0.3, sy * 0.08, 0); g2.add(k); }
    } else {
      const m = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.09, 8).rotateX(Math.PI / 2), Lmat(0xe0a640)); g2.add(m);
      for (let i = 0; i < 3; i++) { const d = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 0.04), Lmat(0x5e2a16)); d.position.set(Math.cos(i * 2.1) * 0.1, Math.sin(i * 2.1) * 0.1, 0.06); g2.add(d); }
    }
    scene.add(g2); return g2;
  }
  let enM = [], pkM = [];
  // 조각(먼지·반짝·별): 작은 정이십면체 묶음
  const PART_N = 160;
  const partMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 0), new THREE.MeshLambertMaterial({ flatShading: true }), PART_N);
  partMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); partMesh.count = 0; partMesh.frustumCulled = false; scene.add(partMesh);
  const parts = [];
  const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _p = new THREE.Vector3(), _s = new THREE.Vector3(), _c = new THREE.Color();
  function burst(x, y, n, color, sp, up, life, size) {
    if (REDUCE) n = Math.ceil(n / 3);
    for (let i = 0; i < n && parts.length < PART_N; i++) { const a = Math.random() * Math.PI * 2; parts.push({ x, y, z: 0.6, vx: Math.cos(a) * sp * Math.random(), vy: up + Math.sin(a) * sp * Math.random(), t: 0, life: life * (0.7 + Math.random() * 0.6), c: color, s: size }); }
  }
  function drawParts(dt) {
    let n = 0;
    for (let i = parts.length - 1; i >= 0; i--) { const q = parts[i]; q.t += dt; if (q.t > q.life) { parts.splice(i, 1); continue; } q.vy -= 12 * dt; q.x += q.vx * dt; q.y += q.vy * dt; }
    for (const q of parts) { const k = 1 - q.t / q.life; _p.set(q.x, q.y, q.z); _s.setScalar(q.s * (0.4 + 0.6 * k)); partMesh.setMatrixAt(n, _m.compose(_p, _q.identity(), _s)); partMesh.setColorAt(n, _c.set(q.c)); n++; }
    partMesh.count = n; partMesh.instanceMatrix.needsUpdate = true; if (partMesh.instanceColor) partMesh.instanceColor.needsUpdate = true;
  }

  // ── 카메라: 옆에서 조금 위(8°). 보이는 폭: 세로 12 칸 · 가로 20 칸(아이패드 세로 15) ──
  const CAM = { x: 0, y: 2, gy: 0, look: 0, width: 9, hView: 14, frac: 0.68 };
  function fit() {
    const land = innerWidth > innerHeight;
    document.body.classList.toggle("land", land);
    const cap = +(hash.match(/dprcap=(\d)/) || [])[1] || 2;
    const DPR = Math.min(cap, devicePixelRatio || 1);
    const w = $("view").clientWidth || 360, h = $("view").clientHeight || 400;
    renderer.setPixelRatio(DPR); renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    // 1판은 세로 12 칸 + 높이 상한 11 칸이었다 → 땅이 화면 가운데 위로 떠 아래 절반이 빈 회색, 코코가 폭 1/10(화면 보고 고침).
    // 지금: 보이는 폭 세로 9 칸(아이패드 세로 13) · 가로 16 칸(큰 가로 18), 땅은 세로 화면 위에서 68 %, 가로 56 %(가로는 단추가 아래에 뜬다)
    CAM.width = land ? (w >= 1000 ? 18 : 16) : w >= 760 ? 13 : 9;
    CAM.dist = CAM.width / (2 * Math.tan((camera.fov * Math.PI) / 360) * camera.aspect);
    CAM.hView = 2 * CAM.dist * Math.tan((camera.fov * Math.PI) / 360);
    CAM.frac = land ? 0.56 : 0.68;
  }
  addEventListener("resize", fit);

  // ── 입력 ──
  const inp = { x: 0, down: false, jump: false, jumpTap: 0, skillTap: 0 };
  window.__home.inp = inp;
  const keys = new Set();
  let mvPtr = null, mvX = 0;
  const mv = $("mv");
  function mvAt(e) {
    const r = mv.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2);
    mvX = Math.abs(dx) < 8 ? 0 : Math.sign(dx);
    $("mvL").classList.toggle("on", mvX < 0); $("mvR").classList.toggle("on", mvX > 0);
  }
  mv.addEventListener("pointerdown", (e) => { e.preventDefault(); mvPtr = e.pointerId; mv.setPointerCapture(e.pointerId); mvAt(e); audioOn(); });
  mv.addEventListener("pointermove", (e) => { if (e.pointerId === mvPtr) mvAt(e); });
  const mvEnd = (e) => { if (e.pointerId !== mvPtr) return; mvPtr = null; mvX = 0; $("mvL").classList.remove("on"); $("mvR").classList.remove("on"); };
  mv.addEventListener("pointerup", mvEnd); mv.addEventListener("pointercancel", mvEnd); mv.addEventListener("lostpointercapture", mvEnd);
  function holdBtn(el, onDown, onUp) {
    const ids = new Set();
    el.addEventListener("pointerdown", (e) => { e.preventDefault(); ids.add(e.pointerId); el.setPointerCapture(e.pointerId); el.classList.add("on"); onDown(); audioOn(); });
    const up = (e) => { if (!ids.delete(e.pointerId)) return; if (!ids.size) { el.classList.remove("on"); onUp(); } };
    el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up); el.addEventListener("lostpointercapture", up);
    el.addEventListener("contextmenu", (e) => e.preventDefault());
  }
  let jumpBtn = false;
  holdBtn($("bj"), () => { jumpBtn = true; inp.jumpTap++; }, () => (jumpBtn = false));
  holdBtn($("bs"), () => inp.skillTap++, () => {});
  const JUMP_K = ["Space", "KeyZ", "ArrowUp", "KeyW", "KeyK"], SKILL_K = ["KeyX", "ShiftLeft", "ShiftRight", "KeyJ"];
  addEventListener("keydown", (e) => {
    if (e.repeat) { if (JUMP_K.includes(e.code) || e.code.startsWith("Arrow") || e.code === "Space") e.preventDefault(); return; }
    keys.add(e.code);
    if (JUMP_K.includes(e.code)) inp.jumpTap++;
    if (SKILL_K.includes(e.code)) inp.skillTap++;
    if (e.code === "KeyR" && running) start();
    if (e.code === "Enter" && !running) start();
    if (e.code.startsWith("Arrow") || e.code === "Space") e.preventDefault();
    audioOn();
  });
  addEventListener("keyup", (e) => keys.delete(e.code));
  addEventListener("blur", () => { keys.clear(); jumpBtn = false; mvX = 0; });
  function readInput() {
    const kx = (keys.has("ArrowRight") || keys.has("KeyD") ? 1 : 0) - (keys.has("ArrowLeft") || keys.has("KeyA") ? 1 : 0);
    inp.x = kx || mvX;
    inp.down = keys.has("ArrowDown") || keys.has("KeyS");
    inp.jump = jumpBtn || JUMP_K.some((k) => keys.has(k));
  }

  // ── 소리(짧은 삑 — 파일 없음) ──
  let AC = null;
  function audioOn() { if (AC || MUTE) return; try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  function beep(f0, f1, dur, type, vol) {
    if (!AC || MUTE) return;
    const t = AC.currentTime, o = AC.createOscillator(), gn = AC.createGain();
    o.type = type || "square"; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
    gn.gain.setValueAtTime((vol || 0.06), t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  const SFX = {
    jump: () => beep(420, 760, 0.12, "square", 0.045), land: () => beep(160, 90, 0.06, "triangle", 0.05),
    scoot: () => beep(300, 180, 0.22, "sawtooth", 0.03), spin: () => beep(500, 1100, 0.2, "triangle", 0.05),
    kill: () => beep(700, 1400, 0.1, "square", 0.04), pick: () => beep(880, 1320, 0.08, "triangle", 0.05),
    heart: () => beep(660, 990, 0.25, "sine", 0.07), hurt: () => beep(300, 120, 0.22, "sine", 0.07),
    pit: () => beep(500, 80, 0.4, "sine", 0.06), cp: () => beep(520, 780, 0.18, "triangle", 0.05), clear: () => beep(520, 1040, 0.5, "triangle", 0.06),
  };

  // ── HUD ──
  const HEART = '<svg viewBox="0 0 20 18"><path d="M10 17 C2 11 0 7 2.5 3.6 C4.8 .8 8.4 1.6 10 4.4 C11.6 1.6 15.2 .8 17.5 3.6 C20 7 18 11 10 17Z" fill="#f07a8a" stroke="#a8344a" stroke-width="1.2"/></svg>';
  let hudKey = "";
  function hud() {
    const p = g.p, k = p.hearts + "|" + g.bones + "|" + g.score;
    if (k !== hudKey) {
      hudKey = k;
      $("hearts").innerHTML = Array.from({ length: TU.HEARTS }, (_, i) => HEART.replace("<svg", '<svg class="' + (i < p.hearts ? "" : "off") + '"')).join("");
      $("bones").textContent = g.bones + "/3"; $("score").textContent = g.score;
    }
    $("time").textContent = g.t.toFixed(1);
  }
  let toastT = 0;
  function toast(s, dur) { $("toast").textContent = s; $("toast").classList.add("on"); toastT = dur || 1.1; }

  // ── 판 ──
  function start() {
    g = E.create("test");
    buildWorld(g.L);
    enM.forEach((m) => scene.remove(m)); pkM.forEach((m) => scene.remove(m));
    enM = g.en.map((e) => makeEnemy(e.kind)); pkM = g.pk.map((k) => makePick(k.kind));
    CAM.x = g.p.x + 2; CAM.gy = g.p.y; CAM.y = (CAM.frac - 0.5) * CAM.hView; CAM.look = 2; parts.length = 0; hudKey = "";
    $("ov-start").hidden = true; $("ov-end").hidden = true;
    running = true; acc = 0; prev = { x: g.p.x, y: g.p.y };
    hud();
  }
  $("go").addEventListener("click", () => { audioOn(); start(); });
  $("again").addEventListener("click", () => start());
  function end(kind) {
    running = false;
    const p = g.p;
    if (kind === "clear") {
      $("end-h").textContent = "도착!";
      $("end-p").textContent = "시험 판 끝 — 손맛이 어땠나요?";
    } else {
      $("end-h").textContent = "코코가 조금 지쳤어요";
      $("end-p").textContent = "물 한 모금 마시고 처음부터 다시 가요.";
    }
    $("end-s").innerHTML = `<span>⏱ ${g.t.toFixed(1)}초</span><span>🍪 ${g.score}</span><span>🦴 ${g.bones}/3</span>`;
    setTimeout(() => { $("ov-end").hidden = false; }, kind === "clear" ? 700 : 900);
  }

  // ── 사건 → 연출 ──
  const DUST = "#ecd3a6";
  function onEvents(ev) {
    const p = g.p;
    for (const e of ev) {
      switch (e.type) {
        case "jump": SFX.jump(); burst(p.x, p.y, 5, DUST, 2, 0.5, 0.35, 0.09); if (DEBUG && e.coyote) toast("발판 끝 여유 점프", 0.7); break;
        case "land": SFX.land(); burst(p.x, p.y, e.airT > 0.4 ? 8 : 4, DUST, 2.4, 0.6, 0.35, 0.09); squash = e.airT > 0.4 ? 1 : 0.6; break;
        case "scoot": SFX.scoot(); break;
        case "spin": SFX.spin(); burst(p.x, p.y + 0.4, 8, "#7fe0d4", 3, 1, 0.4, 0.08); break;
        case "kill": SFX.kill(); { const en = g.en[e.id]; burst(en.x, en.y + 0.4, 12, en.kind === "bubble" ? "#e8f4fb" : "#ffd36b", 4, 2, 0.5, 0.1); shake = 0.12; } break;
        case "pick": if (e.kind === "heart") { SFX.heart(); toast("하트 +1"); } else SFX.pick(); { const k = g.pk[e.id]; burst(k.x, k.y, e.kind === "snack" ? 4 : 10, e.kind === "heart" ? "#f07a8a" : "#fff0b8", 2.5, 1.5, 0.4, 0.08); } break;
        case "hurt": SFX.hurt(); shake = 0.25; break;
        case "pit": SFX.pit(); $("fade").classList.add("on"); setTimeout(() => $("fade").classList.remove("on"), 220); break;
        case "cp": SFX.cp(); toast("여기서부터 다시!", 1); break;
        case "clear": SFX.clear(); burst(p.x, p.y + 1, 24, "#ffd36b", 5, 3, 0.9, 0.11); end("clear"); break;
        case "fail": end("fail"); break;
      }
    }
  }

  // ── 그리기 ──
  let squash = 0, shake = 0, poseName = "sit", poseAt = 0, faceY = Math.PI / 2, spinA = 0, prev = { x: 0, y: 0 };
  function groundBelow(x, y) {
    let best = -99;
    for (const s of g.L.solids) if (x > s[0] && x < s[0] + s[2] && s[1] + s[3] <= y + 0.05) best = Math.max(best, s[1] + s[3]);
    for (const s of g.L.semis) if (x > s[0] && x < s[0] + s[2] && s[1] <= y + 0.05) best = Math.max(best, s[1]);
    return best;
  }
  function draw(t, dt, alpha) {
    const p = g.p;
    const px = prev.x + (p.x - prev.x) * alpha, py = prev.y + (p.y - prev.y) * alpha;
    // 카메라: 진행 방향 앞을 더 보여 준다 · 높이는 디딘 땅을 따라 천천히(점프마다 출렁이지 않게)
    CAM.look += ((p.face > 0 ? 2.2 : -2.2) - CAM.look) * Math.min(1, dt * 2.5);
    CAM.x += (px + CAM.look - CAM.x) * Math.min(1, dt * 6);
    if (p.ground || py < CAM.gy) CAM.gy = py; // 디딘 땅 높이(공중에선 내려갈 때만 따라간다)
    const wantY = Math.max(CAM.gy, py - 3.2) + (CAM.frac - 0.5) * CAM.hView; // 디딘 땅이 화면 위에서 CAM.frac 자리에
    CAM.y += (wantY - CAM.y) * Math.min(1, dt * (p.ground ? 3 : 2));
    CAM.x = Math.max(-3 + CAM.width / 2 - 0.5, Math.min(g.L.w + 1 - CAM.width / 2, CAM.x)); // 양 끝 벽까지만
    let sx = 0, sy = 0;
    if (shake > 0 && !REDUCE) { sx = (Math.random() - 0.5) * shake * 0.6; sy = (Math.random() - 0.5) * shake * 0.6; }
    shake = Math.max(0, shake - dt);
    const el = (8 * Math.PI) / 180;
    camera.position.set(CAM.x + sx, CAM.y + sy + Math.sin(el) * CAM.dist, Math.cos(el) * CAM.dist);
    camera.lookAt(CAM.x + sx, CAM.y + sy, 0);
    // 코코
    const want = E.pose(g);
    if (want !== poseName) { poseName = want; poseAt = t; }
    const targetY = p.face > 0 ? Math.PI / 2 : -Math.PI / 2;
    faceY += (targetY - faceY) * Math.min(1, dt * 18);
    let name = poseName, tilt = 0, sp = Math.abs(p.vx) / TU.RUN;
    if (name === "rise") { name = "walk"; tilt = 0.22; sp = 0.25; }
    if (name === "fall") { name = "walk"; tilt = -0.18; sp = 0.25; }
    if (name === "spin") spinA += dt * Math.PI * 2 * (REDUCE ? 1.2 : 3); else spinA = 0;
    coco.root.rotation.y = faceY + spinA;
    coco.pose(t, name, t - poseAt, { speed: sp, hurt: p.iframe > TU.HURT_IFRAME - 0.25 ? 1 : 0, reduce: REDUCE });
    squash = Math.max(0, squash - dt * 6);
    cocoHold.position.set(px, py, 0);
    cocoHold.rotation.z = tilt * Math.sign(Math.sin(faceY) || 1);
    cocoHold.scale.set(1 + 0.12 * squash, 1 - 0.16 * squash, 1 + 0.12 * squash);
    cocoHold.visible = p.iframe <= 0 || REDUCE || Math.floor(t * 14) % 2 === 0 || g.state !== "play";
    const gb = groundBelow(px, py), hAbove = py - gb;
    blob.visible = gb > -50; blob.position.set(px, gb + 0.02, 0.2);
    const bs = Math.max(0.35, 1 - hAbove * 0.18); blob.scale.set(bs, 1, bs); blobMat.opacity = 0.6 * bs;
    // 적 · 먹을 것
    g.en.forEach((e, i) => {
      const m = enM[i];
      if (e.dead) { if (m.visible) { m.scale.multiplyScalar(0.8); if (m.scale.x < 0.1) m.visible = false; } return; }
      m.position.set(e.x, e.y, 0);
      if (e.kind === "brush") { m.rotation.y = e.vx > 0 ? Math.PI : 0; m.children.forEach((c) => { if (c.name === "leg1") c.rotation.z = 0.5 * Math.sin(t * 12); if (c.name === "leg-1") c.rotation.z = -0.5 * Math.sin(t * 12); }); }
      else m.rotation.y = t * 0.6;
    });
    g.pk.forEach((k, i) => { const m = pkM[i]; m.visible = !k.got; if (!k.got) { m.position.set(k.x, k.y + (REDUCE ? 0 : 0.08 * Math.sin(t * 3 + i)), 0); m.rotation.y = REDUCE ? 0 : t * 2; } });
    if (g.cp && !cpFlag.on) { cpFlag.on = true; cpFlag.cloth.material = Lmat(0x2fb5a8); }
    drawParts(dt);
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) $("toast").classList.remove("on"); }
    if (DEBUG) {
      const b = E.pbox(p);
      $("dbg").textContent = `x ${p.x.toFixed(2)} y ${p.y.toFixed(2)}\nvx ${p.vx.toFixed(1)} vy ${p.vy.toFixed(1)}\n땅 ${p.ground ? "예" : "아니오"} 여유 ${(p.coyote * 60).toFixed(0)} 기억 ${(p.buffer * 60).toFixed(0)}\n상자 ${b[2]}×${b[3]} ${poseName}`;
    }
    renderer.render(scene, camera);
  }

  // ── 고리 ──
  let acc = 0, last = performance.now(), t0 = last;
  function frame(now) {
    const f0 = performance.now();
    const gp = window.__home.gaps; gp.push(now - last); if (gp.length > 600) gp.shift();
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    const t = (now - t0) / 1000;
    if (g) {
      if (running) {
        readInput();
        acc += dt;
        while (acc >= TU.DT && running) {
          prev = { x: g.p.x, y: g.p.y };
          const ev = E.step(g, { x: inp.x, down: inp.down, jump: inp.jump, jumpTap: inp.jumpTap > 0, skillTap: inp.skillTap > 0 });
          inp.jumpTap = 0; inp.skillTap = 0; // 누름은 한 걸음에만 넘긴다(그 뒤는 엔진의 기억이 맡는다)
          window.__home.steps++;
          onEvents(ev);
          acc -= TU.DT;
          if (ev.some((e) => e.type === "pit")) prev = { x: g.p.x, y: g.p.y };
        }
        hud();
      }
      draw(t, dt, running ? acc / TU.DT : 1);
    } else idle(t, dt);
    const fr = window.__home.frames; fr.push(performance.now() - f0); if (fr.length > 600) fr.shift();
    requestAnimationFrame(frame);
  }
  // 시작 화면 뒤: 판을 미리 깔고 코코가 앉아 있다
  function idle(t, dt) {
    if (!g) { g = E.create("test"); buildWorld(g.L); enM = g.en.map((e) => makeEnemy(e.kind)); pkM = g.pk.map((k) => makePick(k.kind)); CAM.x = g.p.x + 2; }
  }
  fit();
  g = E.create("test"); buildWorld(g.L); enM = g.en.map((e) => makeEnemy(e.kind)); pkM = g.pk.map((k) => makePick(k.kind)); CAM.x = g.p.x + 2; prev = { x: g.p.x, y: g.p.y };
  requestAnimationFrame(frame);
  window.__home.start = start;
}
</script>
</body>
</html>
