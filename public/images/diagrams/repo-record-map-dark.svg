<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 470" role="img" aria-labelledby="t">
  <title id="t">저장소 지도와 가장 붐비는 방, 건물 밖 공유 수첩</title>
  <g font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">

    <!-- 건물(저장소) -->
    <rect x="96" y="40" width="616" height="300" rx="14" fill="#10141d" stroke="#9aa3b5" stroke-width="2"/>
    <text x="116" y="68" font-size="13" font-weight="700" fill="#e6e8ee">저장소</text>

    <!-- 새 팀원 진입 -->
    <text x="8" y="112" font-size="13" font-weight="700" fill="#e6e8ee">새 팀원</text>
    <text x="8" y="130" font-size="13" font-weight="700" fill="#e6e8ee">새 세션</text>
    <line x1="58" y1="124" x2="84" y2="124" stroke="#e6e8ee" stroke-width="2"/>
    <path d="M94 124 l-9 -5 v10 z" fill="#e6e8ee"/>

    <!-- 지도 게시판 -->
    <rect x="120" y="92" width="180" height="210" rx="8" fill="#161b26" stroke="#9aa3b5" stroke-width="1.5"/>
    <text x="136" y="120" font-size="15" font-weight="700" fill="#e6e8ee">루트 지도</text>
    <text x="136" y="140" font-size="12" fill="#9aa3b5">CLAUDE.md</text>
    <path d="M136 161 l4 4 l8 -9" stroke="#8b93ff" stroke-width="2" fill="none"/>
    <text x="156" y="170" font-size="13" fill="#e6e8ee">방 A</text>
    <path d="M136 187 l4 4 l8 -9" stroke="#8b93ff" stroke-width="2" fill="none"/>
    <text x="156" y="196" font-size="13" fill="#e6e8ee">방 B</text>
    <path d="M136 213 l4 4 l8 -9" stroke="#8b93ff" stroke-width="2" fill="none"/>
    <text x="156" y="222" font-size="13" fill="#e6e8ee">방 C</text>
    <path d="M136 239 l4 4 l8 -9" stroke="#8b93ff" stroke-width="2" fill="none"/>
    <text x="156" y="248" font-size="13" fill="#e6e8ee">방 D</text>
    <rect x="134" y="258" width="152" height="26" rx="6" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="210" y="275" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">가장 붐비는 방 없음</text>

    <!-- 방 A~D -->
    <g>
      <rect x="340" y="92" width="160" height="56" rx="8" fill="#161b26" stroke="#9aa3b5" stroke-width="1.5"/>
      <text x="356" y="118" font-size="15" font-weight="700" fill="#e6e8ee">방 A</text>
      <path d="M356 132 l4 4 l8 -9" stroke="#8b93ff" stroke-width="2" fill="none"/>
      <text x="374" y="137" font-size="12" fill="#9aa3b5">지도 등재</text>
    </g>
    <g>
      <rect x="516" y="92" width="160" height="56" rx="8" fill="#161b26" stroke="#9aa3b5" stroke-width="1.5"/>
      <text x="532" y="118" font-size="15" font-weight="700" fill="#e6e8ee">방 B</text>
      <path d="M532 132 l4 4 l8 -9" stroke="#8b93ff" stroke-width="2" fill="none"/>
      <text x="550" y="137" font-size="12" fill="#9aa3b5">지도 등재</text>
    </g>
    <g>
      <rect x="340" y="156" width="160" height="56" rx="8" fill="#161b26" stroke="#9aa3b5" stroke-width="1.5"/>
      <text x="356" y="182" font-size="15" font-weight="700" fill="#e6e8ee">방 C</text>
      <path d="M356 196 l4 4 l8 -9" stroke="#8b93ff" stroke-width="2" fill="none"/>
      <text x="374" y="201" font-size="12" fill="#9aa3b5">지도 등재</text>
    </g>
    <g>
      <rect x="516" y="156" width="160" height="56" rx="8" fill="#161b26" stroke="#9aa3b5" stroke-width="1.5"/>
      <text x="532" y="182" font-size="15" font-weight="700" fill="#e6e8ee">방 D</text>
      <path d="M532 196 l4 4 l8 -9" stroke="#8b93ff" stroke-width="2" fill="none"/>
      <text x="550" y="201" font-size="12" fill="#9aa3b5">지도 등재</text>
    </g>

    <!-- 가장 붐비는 방 -->
    <rect x="340" y="232" width="336" height="84" rx="8" fill="#1d2135" stroke="#8b93ff" stroke-width="2"/>
    <text x="356" y="262" font-size="15" font-weight="700" fill="#e6e8ee">가장 붐비는 방</text>
    <text x="356" y="284" font-size="13" fill="#9aa3b5">문서 16개 중 12개가 이 방 이야기</text>
    <rect x="566" y="244" width="98" height="22" rx="11" fill="#282316"/>
    <text x="615" y="259" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">지도 언급 0</text>

    <!-- 수첩 → 방 점선 화살표 (건물 벽 관통) -->
    <path d="M560 370 V326" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
    <path d="M560 316 l-5 9 h10 z" fill="#fbbf24"/>
    <text x="548" y="356" font-size="12" fill="#9aa3b5" text-anchor="end">이 방 지식이 여기 적혀 있다</text>

    <!-- 공유 수첩 (건물 밖) -->
    <rect x="472" y="372" width="240" height="84" rx="8" fill="#161b26" stroke="#9aa3b5" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="488" y="396" font-size="13" font-weight="700" fill="#e6e8ee">공유 수첩 — 세션 메모리</text>
    <text x="488" y="415" font-size="12" fill="#9aa3b5">함정: 비슷한 이름의</text>
    <text x="488" y="431" font-size="12" fill="#9aa3b5">디렉터리 두 개 주의</text>
    <text x="488" y="449" font-size="12" font-weight="700" fill="#fbbf24">새 팀원은 못 본다</text>

    <!-- 하단 캡션 -->
    <text x="96" y="452" font-size="13" fill="#9aa3b5">지도에 없는 방은, 문이 열려 있어도 없는 방이다</text>
  </g>
</svg>
