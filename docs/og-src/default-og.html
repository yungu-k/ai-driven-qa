<!doctype html>
<!-- 사이트 기본 OG 이미지(public/default-og.png) 원본. 1200×630.
     다시 찍기: node docs/og-src/shot-og.cjs  (Playwright 필요, PW 환경변수로 경로)
     2026-10-16 슬로건 교체 때 원본이 저장소에 없어 같은 디자인으로 다시 만들었다(07-23 판은 원본 유실). -->
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  html,body{margin:0}
  .og{width:1200px;height:630px;box-sizing:border-box;padding:72px 80px 60px;position:relative;overflow:hidden;
      font-family:"Pretendard Variable",Pretendard,sans-serif;color:#eceef3;
      background:radial-gradient(520px 420px at 1030px 70px,#1d2134 0%,rgba(29,33,52,0) 100%),#0b0d13}
  .pill{display:inline-flex;align-items:center;gap:12px;padding:10px 22px;border:1px solid #262a36;border-radius:999px;
        background:#12151d;color:#a4a9b6;font-size:22px;font-weight:500}
  .pill i{width:9px;height:9px;border-radius:50%;background:#8b93ff;display:inline-block}
  h1{margin:96px 0 0;font-size:84px;line-height:1.15;font-weight:800;letter-spacing:-2px}
  h1 b{color:#8b93ff;font-weight:800}
  .foot{position:absolute;left:80px;right:80px;bottom:56px;display:flex;justify-content:space-between;align-items:baseline}
  .name{font-size:28px;font-weight:700}
  .url{font-size:24px;color:#6f7482}
</style></head><body>
<div class="og">
  <div class="pill"><i></i>QA Engineer × Agentic AI</div>
  <h1>AI와 함께 <b>만들고</b>,<br>검증한 것만 <b>믿는다</b></h1>
  <div class="foot"><span class="name">AI-Driven QA</span><span class="url">ai-driven-qa.vercel.app</span></div>
</div>
</body></html>
